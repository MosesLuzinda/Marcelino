services:
  postgres:
    image: postgres:16-alpine
    container_name: marcelino-postgres
    environment:
      POSTGRES_USER: marcelino
      POSTGRES_PASSWORD: marcelino_dev
      POSTGRES_DB: marcelino_school
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marcelino -d marcelino_school"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marcelino-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
